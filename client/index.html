<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA</title>
    <script type="module">
        import {io} from 'https://cdn.socket.io/4.3.2/socket.io.esm.min.js'

        const getUsername = async () => {
            console.log('entre oiaaaa');
            const username = localStorage.getItem('username')
            if (username) {
                console.log(`User existed ${username}`)
                return username
            }

            console.log(username);

            const res = await fetch('https://randomuser.me//api')
            const data = await res.json();
            console.log(data.results[0].login.username);

            const randomUsername = data.results[0].login.username

            localStorage.setItem('username', randomUsername)
            return randomUsername
        }

        const socket = io({
            auth: {
                token: '123',
                username: await getUsername(),
                serverOffset: 0
            }
        })

        const form = document.getElementById('form')
        const input = document.getElementById('input')
        const messages = document.getElementById('messages')

        socket.on('chat message', (msg, serverOffset, username) => {
            const item = `<li class="message-item">
                            <div class="message-avatar">${username.charAt(0).toUpperCase()}</div>
                            <div class="message-content">
                                <div class="message-header">
                                    <span class="username">${username}</span>
                                    <span class="timestamp">${new Date().toLocaleTimeString()}</span>
                                </div>
                                <p class="message-text">${msg}</p>
                            </div>
                        </li>`

            messages.insertAdjacentHTML('beforeend', item)
            socket.auth.serverOffset = serverOffset
            messages.scrollTop = messages.scrollHeight
        })

        form.addEventListener('submit', (e) => {
            e.preventDefault()
            console.log('entro');

            if(input.value) {
                socket.emit('chat message', input.value)
                input.value = ''
            }
        })
    </script>
    
    <style>
        /* ================================================= */
        /* 🎨 VARIABLES CSS - Paleta Moderna                */
        /* ================================================= */
        :root {
            /* Colores principales */
            --color-primary: #7289da;
            --color-primary-hover: #5b6eae;
            --color-primary-light: rgba(114, 137, 218, 0.1);
            
            /* Backgrounds */
            --color-bg-body: #1e1e2e;
            --color-bg-chat: #2b2d42;
            --color-bg-message: #3a3d5c;
            --color-bg-input: #363a52;
            
            /* Texto */
            --color-text-primary: #ffffff;
            --color-text-secondary: #a0a3bd;
            --color-text-muted: #6c6f85;
            
            /* Bordes y sombras */
            --color-border: #404357;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.4);
            
            /* Espaciado */
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 24px;
            
            /* Bordes redondeados */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 20px;
            --radius-full: 50%;
            
            /* Animaciones */
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
            
            color-scheme: dark;
        }

        /* ================================================= */
        /* 🔧 RESET Y BASE                                  */
        /* ================================================= */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--color-bg-body) 0%, #16161d 100%);
            color: var(--color-text-primary);
            display: grid;
            place-content: center;
            min-height: 100vh;
            padding: var(--spacing-lg);
            overflow: hidden;
        }

        /* ================================================= */
        /* 💬 CONTENEDOR PRINCIPAL DEL CHAT                 */
        /* ================================================= */
        #chat {
            background: var(--color-bg-chat);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            width: min(100%, 600px);
            height: min(90vh, 700px);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================================================= */
        /* 📝 HEADER DEL CHAT                               */
        /* ================================================= */
        #chat::before {
            content: '💬 Chat Room';
            display: block;
            padding: var(--spacing-lg);
            background: linear-gradient(90deg, var(--color-primary) 0%, #5b6eae 100%);
            color: var(--color-text-primary);
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            border-bottom: 1px solid var(--color-border);
        }

        /* ================================================= */
        /* 📜 LISTA DE MENSAJES                             */
        /* ================================================= */
        #messages {
            flex: 1;
            list-style: none;
            overflow-y: auto;
            padding: var(--spacing-lg);
            scroll-behavior: smooth;
            background: linear-gradient(180deg, var(--color-bg-chat) 0%, #252739 100%);
        }

        /* Scrollbar personalizada */
        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: var(--radius-xl);
            transition: background var(--transition-fast);
        }

        #messages::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary);
        }

        /* ================================================= */
        /* 💌 ITEM DE MENSAJE                               */
        /* ================================================= */
        .message-item {
            display: flex;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            border-radius: var(--radius-md);
            transition: background var(--transition-fast);
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message-item:hover {
            background: var(--color-bg-message);
        }

        /* Avatar del usuario */
        .message-avatar {
            width: 40px;
            height: 40px;
            min-width: 40px;
            background: linear-gradient(135deg, var(--color-primary) 0%, #5b6eae 100%);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--color-text-primary);
            box-shadow: var(--shadow-sm);
        }

        /* Contenido del mensaje */
        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xs);
        }

        .username {
            font-weight: 600;
            color: var(--color-text-primary);
            font-size: 0.95rem;
        }

        .timestamp {
            font-size: 0.7rem;
            color: var(--color-text-muted);
        }

        .message-text {
            color: var(--color-text-secondary);
            line-height: 1.5;
            word-wrap: break-word;
            margin: 0;
        }

        /* ================================================= */
        /* ✏️ FORMULARIO DE ENTRADA                         */
        /* ================================================= */
        #form {
            display: flex;
            gap: var(--spacing-sm);
            padding: var(--spacing-lg);
            background: var(--color-bg-chat);
            border-top: 1px solid var(--color-border);
            align-items: center;
        }

        #input {
            flex: 1;
            background: var(--color-bg-input);
            border: 2px solid transparent;
            border-radius: var(--radius-xl);
            padding: var(--spacing-md) var(--spacing-lg);
            color: var(--color-text-primary);
            font-size: 0.95rem;
            transition: all var(--transition-normal);
            outline: none;
        }

        #input::placeholder {
            color: var(--color-text-muted);
        }

        #input:focus {
            border-color: var(--color-primary);
            background: var(--color-bg-message);
            box-shadow: 0 0 0 3px var(--color-primary-light);
        }

        #form > button {
            background: linear-gradient(135deg, var(--color-primary) 0%, #5b6eae 100%);
            color: var(--color-text-primary);
            border: none;
            border-radius: var(--radius-xl);
            padding: var(--spacing-md) var(--spacing-xl);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
            white-space: nowrap;
        }

        #form > button:hover {
            background: linear-gradient(135deg, var(--color-primary-hover) 0%, #4a5a8e 100%);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        #form > button:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        /* ================================================= */
        /* 📱 RESPONSIVE DESIGN                             */
        /* ================================================= */
        @media (max-width: 640px) {
            body {
                padding: 0;
            }

            #chat {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border: none;
            }

            .message-avatar {
                width: 32px;
                height: 32px;
                min-width: 32px;
                font-size: 0.9rem;
            }

            #form > button {
                padding: var(--spacing-md) var(--spacing-lg);
            }
        }
    </style>
</head>
<body>
  <section id="chat">
    <ul id="messages"></ul>
    <form id="form">
      <input type="text" name="message" id="input" placeholder="Type a message" autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>
  </section>
</body>
</html>
