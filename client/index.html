<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat IA</title>

    <script type="module">

        import {io} from 'https://cdn.socket.io/4.3.2/socket.io.esm.min.js'

        const getUsername = async () => {
            console.log('entre oiaaaa');
            const username = localStorage.getItem('username')
            if (username) {
                console.log(`User existed ${username}`)
                return username
            }

            console.log(username);

            const res = await fetch('https://randomuser.me//api')
            const data = await res.json();
            console.log(data.results[0].login.username);

            const randomUsername = data.results[0].login.username

            localStorage.setItem('username', randomUsername)
            return randomUsername
        }

        const socket = io({

            auth: { // ->

                token: '123',

                username: await getUsername(),

                serverOffset: 0

            }

        })



        const form = document.getElementById('form')

        const input = document.getElementById('input')

        const messages = document.getElementById('messages')



        socket.on('chat message', (msg, serverOffset, username) => {

            const item = `<li>
                            <p>${msg}</p>
                            <small>${username}</small>
                        </li>`

            messages.insertAdjacentHTML('beforeend', item)

            socket.auth.serverOffset = serverOffset

        })



        form.addEventListener('submit', (e) => {

            e.preventDefault()
            console.log('entro');


            if(input.value) {

                socket.emit('chat message', input.value)

                input.value = ''

            }

        })





    </script>

<style>
    /* ---------------------------------------------------- */
    /* 1. VARIABLES CSS (Minimalista)                        */
    /* ---------------------------------------------------- */
    :root {
        --color-primary: #5865f2;     /* Azul/Morado de acento moderno */
        --color-primary-hover: #4e5bda;
        --color-bg-body: #282c34;     /* Fondo de la ventana (gris oscuro) */
        --color-bg-chat: #3a3f4b;     /* Fondo del contenedor de mensajes (gris más claro) */
        --color-text-main: #f0f0f0;   /* Texto principal (casi blanco) */
        --color-text-secondary: #b9bbbe; /* Texto secundario (usuario, hora) */
        --color-border: #4a4d53;      /* Líneas divisorias */
        --color-input-bg: #40444b;    /* Fondo del campo de entrada */
        --spacing-xs: 4px;
        --spacing-md: 8px;
        --spacing-lg: 16px;
        --form-height: 48px;

        color-scheme: dark; 
    }

    /* ---------------------------------------------------- */
    /* 2. BASE, RESET Y ESTRUCTURA                          */
    /* ---------------------------------------------------- */
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: var(--color-bg-body);
        color: var(--color-text-main);
        display: grid;
        place-content: center;
        height: 100vh;
        padding: var(--spacing-lg); 
        grid-template-rows: 1fr;
    }

    /* ---------------------------------------------------- */
    /* 3. CONTENEDOR PRINCIPAL (#chat)                      */
    /* ---------------------------------------------------- */
    #chat {
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius);
        overflow: hidden;
        /* CORRECCIÓN DE ANCHO */
        /* width: min(100%, 600px);  */
        width: 500px;
        height: min(100vh - 40px, 700px); 
        position: relative;
        background-color: var(--color-bg-chat); 
        padding-top: var(--spacing-md);
    }
    
    /* ---------------------------------------------------- */
    /* 4. LISTA DE MENSAJES (#messages)                     */
    /* ---------------------------------------------------- */
    #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-y: scroll;
        scroll-behavior: smooth;
        padding-bottom: calc(var(--form-height) + var(--spacing-lg)); 
    }

    #messages::-webkit-scrollbar {
        width: 6px;
    }
    #messages::-webkit-scrollbar-thumb {
        background-color: var(--color-border);
        border-radius: 10px;
    }

    #messages > li {
        display: block; 
        padding: var(--spacing-md) var(--spacing-lg);
        border-bottom: 1px solid var(--color-border); 
        transition: background-color 0.2s;
    }

    #messages > li:hover {
        background-color: rgba(0, 0, 0, 0.1); 
    }

    #messages > li:nth-child(odd) {
        background-color: rgba(var(--color-primary), 0.05);
    }

    #messages > li p {
        margin: 0;
        word-break: break-word;
        line-height: 1.4;
    }

    #messages > li small {
        display: block;
        color: var(--color-text-secondary);
        font-size: 0.75rem;
        margin-top: var(--spacing-xs);
    }
    
    /* ---------------------------------------------------- */
    /* 5. FORMULARIO (#form)                                */
    /* ---------------------------------------------------- */
    #form {
        bottom: 0;
        display: flex;
        height: var(--form-height);
        left: 0;
        /* CORRECCIÓN: Padding para centrar verticalmente el botón y el input */
        padding: 6px var(--spacing-lg); 
        position: absolute;
        right: 0;
        background: var(--color-bg-chat);
        border-top: 1px solid var(--color-border);
        align-items: center; /* Asegura el centrado vertical */
    }

    #input {
        border-radius: var(--border-radius);
        border: 1px solid var(--color-border);
        flex: 1;
        margin-right: var(--spacing-md);
        padding: 0 var(--spacing-md);
        height: 36px; /* CORRECCIÓN: Altura fija para visibilidad */
        background-color: var(--color-input-bg);
        color: var(--color-text-main);
    }

    #input:focus {
        outline: 0;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 1px var(--color-primary);
    }

    #form > button {
        background: var(--color-primary);
        color: var(--color-text-main);
        border: 0;
        /* CORRECCIÓN: Altura fija y padding para que sea visible */
        height: 36px; 
        padding: 0 var(--spacing-lg);
        border-radius: var(--border-radius);
        cursor: pointer;
        transition: background 0.2s ease;
        font-weight: bold;
    }

    #form > button:hover {
        background: var(--color-primary-hover);
    }
</style>
</head>

<body>
  <section id="chat">
    <ul id="messages"></ul>
    <form id="form">
      <input type="text" name="message" id="input" placeholder="Type a message" autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>
  </section>

</body>

</html>
